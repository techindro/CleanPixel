name: cleanpixel_ai
description: "CleanPixel AI — Watermark & Object Remover for Mobile"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Networking & Media
  http: ^1.2.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  
  # In-App Purchases & Billing
  purchases_flutter: ^8.0.0
  
  # UI & Design System
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  shared_preferences: ^2.2.2
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
